<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 600 260">
  <!-- Grand rectangle (boîtier) -->
  <rect x="20" y="20" width="560" height="120" rx="12" ry="12"
        fill="#f5f5f5" stroke="#111" stroke-width="3"/>

  <!-- 6 ronds -->
  <!-- Paramètres: centres espacés régulièrement -->
  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle"
     fill="#111" stroke="#111">
    <!-- Rond 1 -->
    <circle cx="90"  cy="80" r="22" fill="#fff" stroke-width="3"/>
    <text x="90"  y="80">H1</text>

    <!-- Rond 2 -->
    <circle cx="170" cy="80" r="22" fill="#fff" stroke-width="3"/>
    <text x="170" y="80">L1</text>

    <!-- Rond 3 -->
    <circle cx="250" cy="80" r="22" fill="#fff" stroke-width="3"/>
    <text x="250" y="80">G1</text>

    <!-- Rond 4 -->
    <circle cx="330" cy="80" r="22" fill="#fff" stroke-width="3"/>
    <text x="330" y="80">H2</text>

    <!-- Rond 5 -->
    <circle cx="410" cy="80" r="22" fill="#fff" stroke-width="3"/>
    <text x="410" y="80">L2</text>

    <!-- Rond 6 -->
    <rect x="460" y="58" width="80" height="40" fill="#fff" stroke-width="3"/>
    <text x="500" y="80">RS232</text>
  </g>
</svg>
