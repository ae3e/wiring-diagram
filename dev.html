<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WiringDiagram Dev</title>
    <style>
      body {
        font-family: "Trebuchet MS", Arial, sans-serif;
        margin: 24px;
      }
      #stage,
      #stage2 {
        width: 100%;
        margin: 0 auto;            /* centre le conteneur */
        display: flex;
        justify-content: center;   /* centre le svg dedans */
        border: 1px dashed #888;
      }
      #stage2 svg {
        width: 100%;
        height: auto;              /* garde les proportions */
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
        }
      }
    </script>
  </head>
  <body>
    <h1>WiringDiagram</h1>
    <p>Tests with sensors connected on a datalogger</p>
    <div id="stage2" style="width:600px"></div>
    <script type="module">
      import { createWiringDiagram } from "./src/index.js";

      let terminals = {
        "H1": {x: 90, y: 90, delta:160},
        "L1": {x: 170, y: 90},
        "G1": {x: 250, y: 90},
        "H2": {x: 330, y: 90, delta:160},
        "L2": {x: 410, y: 90, delta:160},
        "RS232": {x: 500, y: 90, delta:160},
      };

      let wirings = [
        { t: "H1", color: "blue", text:"sensor1" },
        { t: "RS232", color: "red", text:"LONGEST_NAME_02" },
        { t: "H2", color: "red-black", text:"sensor2" },
        { t: "L2", color: "#F0F", text:"sensor2" },
        { t: "L1", color: "yellow-black", text:"sensor1" },
        { t: "G1", color: "red-black", text:"sensor1" },
        { t: "H2", color: "red-black", text:"sensor4" },
        { t: "L2", color: "#F0F", text:"sensor4" },
      ];

      const svg = await createWiringDiagram("./template/test.svg", terminals, wirings);
      svg.setAttribute("width", "600");
      svg.setAttribute("height", "300");
      //svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      //svg.setAttribute("viewBox", `0 -10 600 400`);
      document.querySelector("#stage2").append(svg);
    </script>
    <hr/>

    <div id="stage" style="width:600px"></div>
    <script type="module">
      import { createWiringDiagram } from "./src/index.js";

      let terminals = {
        "H1": {x: 90, y: 65, delta:-60},
        "L1": {x: 170, y: 65},
        "G1": {x: 250, y: 65},
        "H2": {x: 330, y: 65, delta:-60},
        "L2": {x: 410, y: 65, delta:-60},
        "RS232": {x: 500, y: 90, delta:160},
      };

      let wirings = [
        { t: "H1", color: "blue", text:"sensor1" },
        { t: "RS232", color: "red", text:"LONGEST_NAME_02" },
        { t: "H2", color: "red-black", text:"sensor2" },
        { t: "L2", color: "#F0F", text:"sensor2" },
        { t: "L1", color: "yellow-black", text:"sensor1" },
        { t: "G1", color: "red-black", text:"sensor1" },
        { t: "H2", color: "red-black", text:"sensor4" },
        { t: "L2", color: "#F0F", text:"sensor4" },
      ];

      let svg = await createWiringDiagram("./template/test.svg", terminals, wirings)
      svg.setAttribute("height", "300");
      svg.setAttribute("viewBox", `0 -100 600 400`);
      document.querySelector("#stage").append(svg);
    </script>
  </body>
</html>
